# Declares how each spreadsheet in assets/xlsx/ maps onto a JSON file in
# assets/data/. Edit this file - not Python - when a workbook gains, loses or
# renames a column.
#
#   columns:   target JSON field -> list of accepted header names (lowercased).
#              The first header that exists in the sheet wins, so you can keep
#              old names as fallbacks while a workbook is being renamed.
#   optional:  fields allowed to be missing. Anything not listed here is
#              required, and the refresh fails loudly if its column disappears.
#   defaults:  value substituted when a cell is blank or holds a placeholder.
#
# Refresh never touches `status`, `version` or `schemaVersion` in the JSON -
# those stay hand-edited. Only the records array is replaced.
#
# JSON-authored datasets are deliberately absent from this file:
#   components.json, rdk8-non-core-components.json, southbound-apis.json
# Those are edited by hand and are the source of truth. Do not add them here;
# a refresh would overwrite your edits from a stale workbook.

datasets:
  - name: northbound
    workbook: assets/xlsx/RDK8-northbound-api-spec.xlsx
    output: assets/data/northbound-apis.json
    collection: apis
    columns:
      component: [component, service, module, modules]
      name: [api, api name, interface, methods]
      description: [description, details, summary]
      reference: [reference, source, url, repo]
      type: [type]
      releaseTag: [release/tag version, release, tag, version]
    optional: [description, reference, type]
    defaults:
      releaseTag:
        value: "8.0.0"
        when_blank_or: ["???"]
