<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ page.title }}</title>
{%- for href in site.stylesheets %}
<link rel="stylesheet" href="{{ href }}{% if site.asset_version %}?v={{ site.asset_version }}{% endif %}">
{%- endfor %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="{{ site.fonts }}" rel="stylesheet">
</head>
<body>
{% include "partials/nav.html" %}
<main>
{% block content %}{% endblock %}
</main>
{%- if page.footer %}
<footer class="footer"><div class="wrap">{{ site.footer }}</div></footer>
{%- endif %}
<script src="assets/js/nav-dropdown.js" defer></script>
{% block scripts %}{% endblock %}
</body>
</html>
